    <main id="contenu">
        <h1 class="visually-hidden">Nous contacter</h1>

        <!-- action vide : le formulaire est inactif tant qu'un point de collecte
     pédagogique n'a pas été renseigné (cf. README). -->
<form class="contact-form" action="" method="post">
            <p>
                <label for="nom" class="form-label">Nom</label>
                <input id="nom" name="nom" type="text" class="form-control" autocomplete="family-name" required>
            </p>

            <p>
                <label for="prenom" class="form-label">Prénom</label>
                <input id="prenom" name="prenom" type="text" class="form-control" autocomplete="given-name" required>
            </p>

            <p>
                <label for="email" class="form-label">Entrez votre email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="exemple@domaine.com" autocomplete="email" required>
            </p>

            <p>
                <label for="pays" class="form-label">Choisissez un pays d’origine&nbsp;:</label>
                <select name="pays" id="pays" class="form-control" autocomplete="country-name">
                    <option value="france">France</option>
                    <option value="suisse">Suisse</option>
                    <option value="espagne">Espagne</option>
                    <option value="canada">Canada</option>
                    <option value="autre">Autre</option>
                </select>
            </p>

            <p>
                <label for="codepostal" class="form-label">Code postal</label>
                <input id="codepostal" name="codepostal" type="text" inputmode="numeric" pattern="[0-9]{5}" title="5 chiffres requis" class="form-control" autocomplete="postal-code">
            </p>

            <fieldset class="radio-group">
                <legend>Vous avez entendu parler de nous via&nbsp;?</legend>
                <label>
                    <input type="checkbox" name="connu[]" value="Amis"> Amis</label>
                <label>
                    <input type="checkbox" name="connu[]" value="Instagram"> Instagram</label>
                <label>
                    <input type="checkbox" name="connu[]" value="Youtube"> YouTube</label>
                <label>
                    <input type="checkbox" name="connu[]" value="Intérêt pour le sujet"> Intérêt pour le sujet</label>
                <label>
                    <input type="checkbox" name="connu[]" value="Autre"> Autre</label>
            </fieldset>

            <p>
                <label for="date" class="form-label">Date à laquelle vous souhaitez être recontacté</label>
                <input type="date" id="date" name="date" class="form-control">
            </p>

            <p>
                <label for="message" class="form-label">Envoyez un message</label>
                <textarea id="message" name="message" class="form-control" placeholder="Votre message..." rows="6"></textarea>
            </p>

            <p>
                <input type="submit" value="Envoyer" class="form-submit">
            </p>
        </form>
